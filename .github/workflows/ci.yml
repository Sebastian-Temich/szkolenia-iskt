name: CI

on:
  pull_request:
    # Linia integracyjna jest bramkowana tak samo jak `main`. Bez tego PR-y celujace
    # w `integration/**` nie uruchamialy zadnego zadania — tak przeszedl bez CI
    # PR #7 (ISK-357), ktorego poprawki RODO nie dotarly na linie integracyjna.
    branches: [main, "integration/**"]
  push:
    branches: [main, "integration/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAIL_TRANSPORT: log
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  # ISK-398: Supabase CLI domyslnie ciagnie 13 obrazow z `public.ecr.aws` i robi to
  # rownolegle. Anonimowy pull z ECR Public ma limit 1 pull/s na IP, a runnery GitHuba
  # dziela adresy — stad `toomanyrequests: Rate exceeded` (43x na b9b0e8a) bez zadnego
  # zwiazku ze zmianami w kodzie. Przekierowujemy pull na ghcr.io, gdzie mamy darmowe
  # uwierzytelnienie wbudowanym `GITHUB_TOKEN` (patrz krok "Log in to ghcr.io").
  # Wszystkie 13 obrazow jest opublikowanych jako `ghcr.io/supabase/<nazwa>` (zmierzone
  # po manifestach; Docker Hub nie hostuje 5 z nich, dlatego logowanie do Docker Huba
  # nie rozwiazuje tego problemu).
  #
  # ISK-420: 2026-10-22 ok. 20:10 UTC limit zaczal zglaszac SAM ghcr.io
  # (`toomanyrequests: allowed: 44000/minute`) i `database` oraz `e2e` padaly w kroku
  # startu, zanim uruchomil sie jakikolwiek test. Pomiar z tego dnia: ghcr.io odrzucalo
  # ~20-40% pojedynczych, szeregowych zapytan o manifest (takze anonimowo, z innego IP
  # niz runnery) i uwierzytelnienie tego nie zmienialo, a public.ecr.aws odpowiadal 200
  # na wszystkie obrazy. Zaden z rejestrow nie jest wiec sam w sobie bezpieczny: obrazy
  # pobiera krok "Pre-pull Supabase images serially", ktory przechodzi przez liste zrodel.
  #
  # Dwa zrodla tez nie wystarczyly (przebieg 39852110159): ghcr.io odrzucal pull, a
  # public.ecr.aws zglosil wyczerpanie limitu DANYCH (`Data limit exceeded`), wiec 5
  # obrazow nie zmiescilo sie w budzecie prob. Stad trzecie, niezalezne zrodlo —
  # Docker Hub — uzywane dla 10 z 14 obrazow, ktore Supabase tam wydaje pod `supabase/`.
  # Pozostale 4 (`kong`, `mailpit`, `vector`, `imgproxy`) oraz `postgrest` maja na
  # Docker Hubie innego wlasciciela i NIE sa podstawiane: nie da sie dowiesc, ze to
  # bajt w bajt to samo, a cicha podmiana obrazu w bramce jakosci jest gorsza od
  # czerwonej bramki.
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
  SUPABASE_IMAGE_SOURCE_REGISTRIES: ghcr.io public.ecr.aws docker.io
  # Wartosci wylacznie dla CI — NIE sa sekretami ISKT (token/sol generowane lokalnie, ADR-0004).
  # Bez prefiksu NEXT_PUBLIC_, nie trafiaja do klienta. Adresat to adres testowy (transport log).
  FORM_TOKEN_SECRET: ci-only-form-token-secret-0123456789-abcdef
  FORM_THROTTLE_SALT: ci-only-form-throttle-salt-0123456789-abcdef
  INQUIRY_NOTIFICATION_TO: biuro@example.invalid
  # Techniczna bramka RODO (ISK-357 P1): produkcyjnie klauzula pozostaje NIEzatwierdzona
  # (RODO_CLAUSE_APPROVED=false, dopoki ISKT nie dostarczy tresci). W CI wlaczamy sciezke zapisu,
  # by e2e happy-path i route /api/inquiries dzialaly — to wartosc wylacznie testowa, nie decyzja ISKT.
  RODO_CLAUSE_APPROVED: "true"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  database:
    name: database
    runs-on: ubuntu-latest
    # `packages: read` jest potrzebne do uwierzytelnionego pulla obrazow z ghcr.io (ISK-398).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci
      - name: Initialize temporary local configuration for E1
        run: test -f supabase/config.toml || supabase init
      # Uwierzytelniony pull obrazow (ISK-398) wbudowanym GITHUB_TOKEN — bez nowych
      # sekretow repo. Celowo bez `docker/login-action`: jedno `docker login` nie jest
      # warte dodania zewnetrznej akcji do lancucha dostaw bramki.
      - name: Log in to ghcr.io for Supabase image pulls
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      # ISK-420: obrazy ciagniemy SAMI, szeregowo, z ponowieniem i rejestrem zapasowym.
      # `supabase start` robilby to w 13 rownoleglych pullach z jednym ponowieniem i
      # padal, gdy rejestr odmowil (tak 2026-10-22 ghcr.io zatrzymalo cala dostawe).
      - name: Pre-pull Supabase images serially
        run: ./scripts/ci-prepull-supabase-images.sh
      - name: Start local Supabase
        run: ./scripts/ci-start-supabase.sh
      - name: Export local-only Supabase variables
        run: ./scripts/ci-export-supabase-env.sh
      - run: supabase db reset
      - run: npm run test:integration
      - name: Collect local Supabase diagnostics
        if: failure()
        run: |
          mkdir -p test-results/supabase
          supabase status > test-results/supabase/status.log 2>&1 || true
          docker ps -a > test-results/supabase/containers.log 2>&1 || true
          cp supabase-prepull.log test-results/supabase/ 2>/dev/null || true
          cp supabase-start.log test-results/supabase/ 2>/dev/null || true
      - name: Upload Supabase diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-logs
          path: test-results/supabase
          if-no-files-found: ignore

  e2e:
    name: e2e
    needs: quality
    runs-on: ubuntu-latest
    # `packages: read` jest potrzebne do uwierzytelnionego pulla obrazow z ghcr.io (ISK-398).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci
      - name: Initialize temporary local configuration for E1
        run: test -f supabase/config.toml || supabase init
      # Uwierzytelniony pull obrazow (ISK-398) wbudowanym GITHUB_TOKEN — bez nowych
      # sekretow repo. Celowo bez `docker/login-action`: jedno `docker login` nie jest
      # warte dodania zewnetrznej akcji do lancucha dostaw bramki.
      - name: Log in to ghcr.io for Supabase image pulls
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      # ISK-420: obrazy ciagniemy SAMI, szeregowo, z ponowieniem i rejestrem zapasowym.
      # `supabase start` robilby to w 13 rownoleglych pullach z jednym ponowieniem i
      # padal, gdy rejestr odmowil (tak 2026-10-22 ghcr.io zatrzymalo cala dostawe).
      - name: Pre-pull Supabase images serially
        run: ./scripts/ci-prepull-supabase-images.sh
      - name: Start local Supabase
        run: ./scripts/ci-start-supabase.sh
      - name: Export local-only Supabase variables
        run: ./scripts/ci-export-supabase-env.sh
      - run: npm run build
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Testujemy artefakt builda zrobionego wyzej, zgodnie z ADR-0005 D2.
      # Bez tej zmiennej `playwright.config.ts` startuje `npm run dev`, czyli
      # build byl nieuzywany, a bramka E2E sprawdzala kod w trybie
      # deweloperskim. Nie jest to tylko marnotrawstwo: w trybie dev kazda
      # nieskompilowana trasa kompiluje sie na zadanie, a przy kilku workerach
      # rownoczesne wejscia w trasy panelu konczyly sie `net::ERR_ABORTED`
      # i przerwanymi nawigacjami — testy padaly, mimo ze aplikacja byla sprawna.
      # Trzy przebiegi formularza na tej samej bazie; bez resetu i bez retries.
      - name: Verify form isolation without retries
        run: npm run test:e2e -- --project=chromium-forms --grep @form-submit --retries=0 --repeat-each=3
        env:
          PLAYWRIGHT_USE_BUILD: "1"
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_BUILD: "1"
      - name: Collect local Supabase diagnostics
        if: failure()
        run: |
          mkdir -p test-results/supabase
          supabase status > test-results/supabase/status.log 2>&1 || true
          docker ps -a > test-results/supabase/containers.log 2>&1 || true
          cp supabase-prepull.log test-results/supabase/ 2>/dev/null || true
          cp supabase-start.log test-results/supabase/ 2>/dev/null || true
      - name: Upload Playwright and Supabase failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
